{% extends "marketplace/base.html" %}
{% block title %}ویرایش محصول{% endblock %}
{% block content %}
<section class="mx-auto max-w-2xl px-4 py-8">
  <h1 class="text-3xl text-ink">ویرایش محصول</h1>
  <form method="post" enctype="multipart/form-data" class="mt-4 space-y-4 border border-line bg-sheet p-5 sm:p-6">
    {% csrf_token %}
    {% include "marketplace/partials/product_fields.html" %}
    <button type="submit" class="w-full rounded-2xl bg-teal-600 py-3 text-sm font-bold text-white">ذخیره محصول</button>
  </form>
  <form method="post" class="mt-3" onsubmit="return confirm('این محصول حذف شود؟');">
    {% csrf_token %}
    <button type="submit" name="action" value="delete" class="w-full rounded-2xl border border-rose-200 py-3 text-sm font-bold text-rose-700 hover:bg-rose-50">حذف محصول</button>
  </form>
</section>
{% endblock %}
